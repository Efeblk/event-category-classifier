<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event request extractor</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 18px;
         color: #0b0b0b; background: #fcfcfb; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 56px; }
  h1 { font-size: 2rem; margin: 0 0 14px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab { font: inherit; font-weight: 600; background: #fcfcfb; color: #0b0b0b; border: 2px solid #0b0b0b;
         border-radius: 8px; padding: 8px 20px; cursor: pointer; }
  .tab[aria-selected="true"] { background: #0b0b0b; color: #fcfcfb; }
  .card { background: #fcfcfb; border: 1px solid #b9b9b4; border-radius: 10px; padding: 18px; margin-bottom: 16px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 96px; font: inherit; padding: 12px; color: #0b0b0b;
             background: #fff; border: 2px solid #52514e; border-radius: 8px; resize: vertical; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  button { font: inherit; background: #0b0b0b; color: #fcfcfb; border: 0; border-radius: 8px; padding: 10px 22px;
           cursor: pointer; font-weight: 600; }
  button:disabled { opacity: 0.45; cursor: default; }
  .muted { color: #52514e; font-size: 0.95rem; }
  .note { color: #52514e; font-size: 0.9rem; margin: 12px 0 0; }
  .error { color: #b42318; font-weight: 600; }
  .examples-title { color: #52514e; font-size: 0.95rem; margin: 0 0 6px; }
  .examples { display: flex; flex-direction: column; gap: 8px; }
  .examples button { background: #fcfcfb; color: #0b0b0b; border: 1px solid #52514e; text-align: left;
                     font-weight: 400; padding: 8px 12px; }
  .legend-line { display: flex; gap: 18px; margin: 0 0 8px; font-size: 0.95rem; }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; }
  .swatch.city { background: #2a78d6; }
  .swatch.date { background: #1baf7a; }
  .swatch.event_name { background: #eb6834; }
  .model-row { border-top: 1px solid #b9b9b4; padding: 14px 0 8px; }
  .model-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .model-name { font-weight: 700; font-size: 1.15rem; }
  .family { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; border: 1px solid #52514e;
            border-radius: 4px; padding: 1px 6px; }
  .ms { margin-left: auto; color: #52514e; font-size: 0.9rem; }
  .request { font-size: 1.15rem; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; }
  .summary { font-size: 1rem; }
  mark { padding: 1px 3px; border-radius: 4px; color: #0b0b0b; }
  mark.city { background: #dbe8f9; box-shadow: inset 0 -3px #2a78d6; }
  mark.date { background: #d3f1e4; box-shadow: inset 0 -3px #1baf7a; }
  mark.event_name { background: #fde2d5; box-shadow: inset 0 -3px #eb6834; }
  .assistant { font-size: 1.2rem; font-weight: 600; margin: 18px 0 0; }
  h2.results-title { font-size: 1.5rem; margin: 0 0 4px; }
  .tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .tile { background: #fcfcfb; border: 1px solid #b9b9b4; border-radius: 10px; padding: 14px; }
  .tile-label { color: #52514e; font-size: 0.9rem; }
  .tile-value { font-size: 1.25rem; font-weight: 700; margin: 4px 0; white-space: nowrap; }
  .tile.hero { background: #0b0b0b; color: #fcfcfb; border-color: #0b0b0b; }
  .tile.hero .tile-label, .tile.hero .tile-sub { color: #d6d6d2; }
  .tile.hero .tile-value { font-size: 2.2rem; }
  .tile-sub { color: #52514e; font-size: 0.85rem; }
  .chart-title { font-size: 22px; margin: 0 0 4px; }
  .caption { color: #52514e; margin: 0 0 12px; font-size: 0.95rem; }
  .chart-host { position: relative; }
  svg.chart { width: 100%; height: auto; display: block; }
  .tip { position: absolute; pointer-events: none; background: #0b0b0b; color: #fcfcfb; padding: 6px 10px;
         border-radius: 6px; font-size: 0.9rem; white-space: nowrap; z-index: 2; }
  details.table-view { margin-top: 10px; color: #52514e; }
  details summary { cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.95rem; color: #0b0b0b; }
  th, td { text-align: left; padding: 6px 8px; border-top: 1px solid #b9b9b4; }
  th { color: #52514e; font-weight: 600; }
  td.num { text-align: right; }
</style>
</head>
<body>
<main>
  <h1>Event request extractor</h1>
  <nav class="tabs">
    <button class="tab" id="tab-try" type="button" aria-selected="true">Try it</button>
    <button class="tab" id="tab-results" type="button" aria-selected="false">Results</button>
  </nav>

  <section id="panel-try">
    <div class="card">
      <textarea id="text" maxlength="1000" placeholder="Describe the event you want..."></textarea>
      <div class="row">
        <label><input type="checkbox" id="use-jev" disabled> Ask Jev (paid call)</label>
        <span id="jev-status" class="muted"></span>
        <button id="compare" type="button">Compare</button>
      </div>
      <p id="log-note" class="note" hidden>Requests are saved locally to data/user_requests/ for testing.</p>
    </div>
    <div class="card">
      <p class="examples-title">Examples</p>
      <div id="examples" class="examples"></div>
    </div>
    <div class="card" id="results" hidden>
      <p class="legend-line">
        <span class="legend-item"><i class="swatch city"></i>city</span>
        <span class="legend-item"><i class="swatch date"></i>date</span>
        <span class="legend-item"><i class="swatch event_name"></i>event</span>
      </p>
      <div id="rows"></div>
      <p id="assistant" class="assistant"></p>
      <p id="notes" class="muted"></p>
      <p id="error" class="error"></p>
    </div>
  </section>

  <section id="panel-results" hidden>
    <h2 class="results-title">Results</h2>
    <p id="results-note" class="muted"></p>
    <p id="results-error" class="error"></p>
    <div id="tiles" class="tiles"></div>
    <div id="charts"></div>
  </section>
</main>
<script>
const EXAMPLES = [
  "im bored, find me a event for tommorrow that so i can go with my girlfriend",
  "wanna catch the lakers game w my dad tmrw",
  "is lizzo playing anywhere near sf soon? need a ticket just for me",
  "my kids love musicals, whats on in NYC next sat",
  "taylor swift in chi-town this wknd??"
];
const FOLLOW_UPS = {
  ask_city: "Ask for the city",
  ask_date: "Ask for the date",
  ask_what: "Ask what kind of event",
  ask_people: "Ask how many people"
};
const SERIES_COLORS = ["#2a78d6", "#eb6834", "#1baf7a"];
const INK = "#0b0b0b";
const SECONDARY = "#52514e";
const GRID = "#e2e2de";
const MUTED = "#b8b7b2";
const SURFACE = "#fcfcfb";
const SET_D = "D: SGD+MASSIVE+typos";
const SETS_AD = ["A: SGD", "B: SGD+MASSIVE", "C: SGD+typos", SET_D];
const CLASSIC_NAMES = ["Dictionary", "Naive Bayes", "Logistic Regression", "Linear SVM"];
const $ = (id) => document.getElementById(id);
const SVG_NS = "http://www.w3.org/2000/svg";

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function svgEl(tag, attrs, text) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  if (text !== undefined) node.textContent = text;
  return node;
}

function fmt(n) { return n.toLocaleString("en-US"); }
function f2(v) { return v.toFixed(2); }
function cell(items) { return items.length ? items.join(", ") : "-"; }

function jevText(status) {
  if (status.jev_off) return "Jev off";
  if (!status.jev_configured) return "Jev not configured";
  if (status.jev_remaining === 0) return "Jev: budget used up";
  return "Jev: " + status.jev_remaining + " calls left";
}

async function loadStatus() {
  try {
    const status = await (await fetch("/api/status")).json();
    $("use-jev").disabled = status.jev_off || !status.jev_configured;
    $("jev-status").textContent = jevText(status);
    $("log-note").hidden = !status.request_log;
  } catch (error) {
    $("jev-status").textContent = "Jev status unavailable";
  }
}

// Offsets from the API count code points, so split the text by code point, not by UTF-16 unit.
function highlight(box, text, spans) {
  const chars = Array.from(text);
  box.textContent = "";
  let position = 0;
  for (const span of [...spans].sort((a, b) => a.start - b.start)) {
    if (span.start < position) continue;
    box.append(chars.slice(position, span.start).join(""));
    box.append(el("mark", span.slot, chars.slice(span.start, span.end).join("")));
    position = span.end;
  }
  box.append(chars.slice(position).join(""));
}

function modelRow(model, text) {
  const card = el("div", "model-row");
  const head = el("div", "model-head");
  head.append(el("span", "model-name", model.name), el("span", "family", model.family),
              el("span", "ms", model.elapsed_ms + " ms"));
  const request = el("div", "request");
  highlight(request, text, model.spans);
  const slots = model.slots;
  card.append(head, request, el("div", "summary",
    [cell(slots.city), cell(slots.date), cell(slots.event_name)].join(" · ")));
  return card;
}

function jevRow(jev) {
  const card = el("div", "model-row");
  const head = el("div", "model-head");
  head.append(el("span", "model-name", "Jev"), el("span", "family", "paid call"));
  const line = jev.status === "ok"
    ? "Event type: " + jev.event_type + " · Tickets: " + jev.tickets + " · Status: ok"
    : "Status: " + jev.status + (jev.message ? " · " + jev.message : "");
  card.append(head, el("div", "summary", line));
  return card;
}

function showCompare(data) {
  const rows = $("rows");
  rows.textContent = "";
  for (const model of data.models) rows.append(modelRow(model, data.text));
  rows.append(jevRow(data.jev));
  const bertweet = data.models.find((model) => model.key === "bertweet");
  const questions = bertweet ? bertweet.follow_ups.map((name) => FOLLOW_UPS[name]) : [];
  $("assistant").textContent = "Assistant would ask: " + (questions.join("; ") || "None, ready to search");
  $("notes").textContent = data.notes.join(" · ");
  $("results").hidden = false;
}

async function compare() {
  const button = $("compare");
  button.disabled = true;
  $("error").textContent = "";
  $("results").hidden = false;
  $("rows").textContent = "Running every model...";
  $("assistant").textContent = "";
  $("notes").textContent = "";
  try {
    const response = await fetch("/api/compare", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: $("text").value, use_jev: $("use-jev").checked })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Request failed (" + response.status + ").");
    showCompare(data);
  } catch (error) {
    $("rows").textContent = "";
    $("error").textContent = error.message;
  } finally {
    button.disabled = false;
    loadStatus();
  }
}

function showTab(name) {
  const trying = name === "try";
  $("panel-try").hidden = !trying;
  $("panel-results").hidden = trying;
  $("tab-try").setAttribute("aria-selected", String(trying));
  $("tab-results").setAttribute("aria-selected", String(!trying));
  if (!trying) loadResults();
}

let resultsLoaded = false;
async function loadResults() {
  if (resultsLoaded) return;
  try {
    const data = await (await fetch("/api/results")).json();
    renderResults(data);
    resultsLoaded = true;
  } catch (error) {
    $("results-error").textContent = "Results unavailable: " + error.message;
  }
}

function tile(label, value, sub, hero) {
  const node = el("div", hero ? "tile hero" : "tile");
  node.append(el("div", "tile-label", label), el("div", "tile-value", value), el("div", "tile-sub", sub));
  return node;
}

function renderTiles(data) {
  const tiles = $("tiles");
  tiles.textContent = "";
  const stats = data.stats || {};
  const split = (s) => "+ " + fmt(s.dev.rows) + " dev, " + fmt(s.test.rows) + " test";
  if (stats.sgd) tiles.append(tile("SGD training requests", fmt(stats.sgd.train.rows), split(stats.sgd)));
  if (stats.massive) tiles.append(tile("MASSIVE training requests", fmt(stats.massive.train.rows), split(stats.massive)));
  if (data.messy_test_rows !== undefined) {
    tiles.append(tile("Messy test requests", fmt(data.messy_test_rows), "AI-drafted, hand-checked, never trained on"));
  }
  if (data.user_requests !== undefined) {
    tiles.append(tile("Logged user requests", fmt(data.user_requests), "saved locally for testing"));
  }
  // Both models were chosen on dev; the messy set is only reported, never used to pick.
  const bertweet = (data.transformers || []).find((t) => t.key === "bertweet");
  const linearSvm = (data.classic || []).find((r) => r.training_set === SET_D && r.name === "Linear SVM");
  if (bertweet) {
    const sub = linearSvm ? "vs Linear SVM " + f2(linearSvm.messy_f1) + " (both chosen on dev)" : "";
    tiles.append(tile("Messy-test F1 (BERTweet)", f2(bertweet.messy_f1), sub, true));
  }
}

// One chart card: title, caption, legend slot, drawing host and a collapsible table.
function chartSection(title, caption) {
  const card = el("section", "card");
  const legend = el("div", "legend-line");
  const host = el("div", "chart-host");
  const details = el("details", "table-view");
  details.append(el("summary", null, "Table"));
  card.append(el("h2", "chart-title", title), el("p", "caption", caption), legend, host, details);
  $("charts").append(card);
  return { legend, host, details };
}

function tipFor(host) {
  let tip = host.querySelector(".tip");
  if (!tip) {
    tip = el("div", "tip");
    tip.hidden = true;
    host.append(tip);
  }
  return tip;
}

function attachTip(node, host, text) {
  node.addEventListener("mousemove", (event) => {
    const tip = tipFor(host);
    const box = host.getBoundingClientRect();
    tip.textContent = text;
    tip.hidden = false;
    tip.style.left = (event.clientX - box.left + 14) + "px";
    tip.style.top = (event.clientY - box.top + 14) + "px";
  });
  node.addEventListener("mouseleave", () => { tipFor(host).hidden = true; });
}

function drawLegend(legend, series) {
  if (series.length < 2) return;
  for (const s of series) {
    const item = el("span", "legend-item");
    const swatch = el("i", "swatch");
    swatch.style.background = s.color;
    item.append(swatch, el("span", null, s.name));
    legend.append(item);
  }
}

function drawTable(section, headers, rows) {
  const table = el("table");
  const head = el("tr");
  for (const h of headers) head.append(el("th", null, h));
  const body = el("tbody");
  for (const row of rows) {
    const tr = el("tr");
    row.forEach((value, i) => tr.append(el("td", i === 0 ? null : "num", value)));
    body.append(tr);
  }
  table.append(el("thead"), body);
  table.querySelector("thead").append(head);
  section.details.append(table);
}

// Rounded only at the value end, anchored at x0. Radius is capped by the bar size.
function barPath(x0, y, w, h, r) {
  if (w <= 0) return "";
  const k = Math.min(r, w, h / 2);
  return `M${x0},${y} H${x0 + w - k} A${k},${k} 0 0 1 ${x0 + w},${y + k} V${y + h - k} ` +
         `A${k},${k} 0 0 1 ${x0 + w - k},${y + h} H${x0} Z`;
}

// Grouped horizontal bars on a 0 to 1 axis. series[i].colors, when given, colours each category's bar.
function drawBars(section, categories, series) {
  drawLegend(section.legend, series);
  if (series.every((s) => s.values.every((v) => v == null))) {
    section.host.append(el("p", "muted", "No data yet."));
    return;
  }
  const W = 1000, L = 230, R = 64, top = 8, bh = 14, gap = 2, groupGap = 18, axisH = 40;
  const plotW = W - L - R;
  const groupH = series.length * bh + (series.length - 1) * gap;
  const H = top + categories.length * groupH + (categories.length - 1) * groupGap + axisH;
  const plotBottom = H - axisH;
  const x = (v) => L + v * plotW;
  const svg = svgEl("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img" });
  for (const t of [0, 0.25, 0.5, 0.75, 1]) {
    svg.append(svgEl("line", { x1: x(t), x2: x(t), y1: top, y2: plotBottom, stroke: GRID, "stroke-width": 1 }));
    svg.append(svgEl("text", { x: x(t), y: plotBottom + 22, "text-anchor": "middle", fill: SECONDARY,
                               "font-size": 15 }, f2(t)));
  }
  categories.forEach((label, c) => {
    const groupTop = top + c * (groupH + groupGap);
    svg.append(svgEl("text", { x: L - 14, y: groupTop + groupH / 2 + 5, "text-anchor": "end", fill: INK,
                               "font-size": 15 }, label));
    series.forEach((s, i) => {
      const v = s.values[c];
      if (v == null) return;
      const y = groupTop + i * (bh + gap);
      const color = s.colors ? s.colors[c] : s.color;
      const bar = svgEl("path", { d: barPath(L, y, x(v) - L, bh, 4), fill: color });
      attachTip(bar, section.host, `${label} · ${s.name}: ${v.toFixed(3)}`);
      svg.append(bar, svgEl("text", { x: x(v) + 6, y: y + bh / 2 + 5, fill: INK, "font-size": 15 }, f2(v)));
    });
  });
  section.host.append(svg);
  drawTable(section, ["Model", ...series.map((s) => s.name)],
    categories.map((label, c) => [label, ...series.map((s) => (s.values[c] == null ? "-" : f2(s.values[c])))]));
}

// Dumbbell rows: one dot per test set joined by a grey line. Axis 0.4 to 1.0. groups: [{heading, rows}].
function drawDumbbell(section, groups) {
  drawLegend(section.legend, [{ name: "SGD test", color: SERIES_COLORS[0] },
                              { name: "Messy test", color: SERIES_COLORS[1] }]);
  const W = 1000, L = 230, R = 170, top = 8, rowH = 34, headH = 34, dividerH = 18;
  const plotRight = W - R;
  const x = (v) => L + ((v - 0.4) / 0.6) * (plotRight - L);
  const layout = [];
  let y = top;
  groups.forEach((group, g) => {
    if (g > 0) {
      layout.push({ kind: "divider", y: y + dividerH / 2 });
      y += dividerH;
    }
    layout.push({ kind: "heading", y: y + headH * 0.7, text: group.heading });
    y += headH;
    for (const row of group.rows) {
      layout.push({ kind: "row", y: y + rowH / 2, row: row });
      y += rowH;
    }
  });
  const axisY = y + 8;
  const H = axisY + 56;
  const svg = svgEl("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img" });
  for (let i = 0; i <= 6; i++) {
    const v = Math.round((0.4 + i * 0.1) * 10) / 10;
    svg.append(svgEl("line", { x1: x(v), x2: x(v), y1: top, y2: axisY, stroke: GRID, "stroke-width": 1 }));
    svg.append(svgEl("text", { x: x(v), y: axisY + 22, "text-anchor": "middle", fill: SECONDARY,
                               "font-size": 15 }, f2(v)));
  }
  svg.append(svgEl("text", { x: (L + plotRight) / 2, y: axisY + 48, "text-anchor": "middle", fill: SECONDARY,
                             "font-size": 15 }, "F1 (axis starts at 0.4)"));
  for (const item of layout) {
    if (item.kind === "divider") {
      svg.append(svgEl("line", { x1: 0, x2: W, y1: item.y, y2: item.y, stroke: GRID, "stroke-width": 1 }));
    } else if (item.kind === "heading") {
      svg.append(svgEl("text", { x: 0, y: item.y, fill: SECONDARY, "font-size": 15, "font-weight": 700 }, item.text));
    } else {
      const row = item.row;
      const hasBoth = row.sgd != null && row.messy != null;
      svg.append(svgEl("text", { x: L - 14, y: item.y + 5, "text-anchor": "end", fill: INK,
                                 "font-size": 15 }, row.name));
      if (hasBoth) {
        svg.append(svgEl("line", { x1: x(row.messy), x2: x(row.sgd), y1: item.y, y2: item.y,
                                   stroke: MUTED, "stroke-width": 2 }));
      }
      const dots = [[row.sgd, SERIES_COLORS[0], "SGD test"], [row.messy, SERIES_COLORS[1], "Messy test"]];
      for (const [v, color, label] of dots) {
        if (v == null) continue;
        const dot = svgEl("circle", { cx: x(v), cy: item.y, r: 7, fill: color, stroke: SURFACE, "stroke-width": 2 });
        attachTip(dot, section.host, `${row.name} · ${label}: ${v.toFixed(3)}`);
        svg.append(dot);
      }
      if (row.messy != null) {
        svg.append(svgEl("text", { x: x(row.messy) - 12, y: item.y + 5, "text-anchor": "end", fill: INK,
                                   "font-size": 15 }, f2(row.messy)));
      }
      if (hasBoth) {
        const drop = row.sgd - row.messy;
        svg.append(svgEl("text", { x: plotRight + 24, y: item.y + 5, fill: SECONDARY, "font-size": 15 },
                         "−" + drop.toFixed(2)));
      }
    }
  }
  section.host.append(svg);
}

// Learning curve on a 0.80 to 1.00 test F1 axis; points are {fraction, value, sentences, label}.
function drawLine(section, points) {
  const W = 1000, H = 340, L = 90, R = 40, T = 34, B = 64;
  const x = (f) => L + f * (W - L - R);
  const y = (v) => T + ((1 - v) / 0.2) * (H - T - B);
  const svg = svgEl("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img" });
  for (let i = 0; i <= 4; i++) {
    const v = Math.round((0.8 + i * 0.05) * 100) / 100;
    svg.append(svgEl("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: GRID, "stroke-width": 1 }));
    svg.append(svgEl("text", { x: L - 12, y: y(v) + 5, "text-anchor": "end", fill: SECONDARY, "font-size": 15 }, f2(v)));
  }
  svg.append(svgEl("text", { x: L - 12, y: T - 14, "text-anchor": "end", fill: SECONDARY, "font-size": 15 }, "test F1"));
  for (const p of points) {
    svg.append(svgEl("text", { x: x(p.fraction), y: H - B + 24, "text-anchor": "middle", fill: SECONDARY,
                               "font-size": 15 }, Math.round(p.fraction * 100) + "%"));
  }
  svg.append(svgEl("text", { x: (L + W - R) / 2, y: H - 12, "text-anchor": "middle", fill: SECONDARY,
                             "font-size": 15 }, "share of SGD training sentences"));
  svg.append(svgEl("polyline", { points: points.map((p) => `${x(p.fraction)},${y(p.value)}`).join(" "),
                                 fill: "none", stroke: SERIES_COLORS[0], "stroke-width": 2 }));
  for (const p of points) {
    const dot = svgEl("circle", { cx: x(p.fraction), cy: y(p.value), r: 6, fill: SERIES_COLORS[0] });
    attachTip(dot, section.host, `${p.label}: test F1 ${p.value.toFixed(3)}`);
    svg.append(dot, svgEl("text", { x: x(p.fraction), y: y(p.value) - 14, "text-anchor": "middle", fill: INK,
                                    "font-size": 15 }, f2(p.value)));
  }
  section.host.append(svg);
  drawTable(section, ["Training data", "Sentences", "Test F1"],
    points.map((p) => [Math.round(p.fraction * 100) + "%", fmt(p.sentences), f2(p.value)]));
}

// Captions are built from the numbers, so each claim is checked against the data it describes.
function resultsNote(data) {
  const seed = data.seed !== undefined ? "Single run, seed " + data.seed + ". " : "Single run. ";
  const messy = data.messy_test_rows !== undefined ? "Messy test = " + fmt(data.messy_test_rows) + " " : "Messy test ";
  return seed + messy + "AI-drafted, hand-checked requests; small differences are within noise.";
}

function cleanVsMessyCaption(rows) {
  const top = rows.reduce((a, b) => (b.messy_f1 > a.messy_f1 ? b : a));
  const lower = rows.every((r) => r.messy_f1 < r.sgd_f1)
    ? "Every model scores lower on messy requests than on SGD test; " : "";
  return lower + top.name + " scores highest on messy requests (" + f2(top.messy_f1) + ").";
}

function eventNameCaption(rows) {
  const scored = rows.filter((r) => r.value != null);
  const best = scored.reduce((a, b) => (b.value > a.value ? b : a));
  const others = scored.filter((r) => r !== best).map((r) => r.value);
  if (best.name === "BERTweet" && others.length) {
    return "BERTweet finds event names best (" + f2(best.value) + "); the others reach at most " +
      f2(Math.max(...others)) + ".";
  }
  return "Best event-name F1 on messy requests: " + best.name + " (" + f2(best.value) + ").";
}

function renderResults(data) {
  renderTiles(data);
  $("results-note").textContent = resultsNote(data);
  const classicRows = data.classic || [];
  const transformers = data.transformers || [];
  const classicD = CLASSIC_NAMES.map((name) => classicRows.find((r) => r.training_set === SET_D && r.name === name) || null);
  const allD = [...classicD, ...transformers].filter(Boolean);

  const one = chartSection("Clean vs messy F1", allD.length ? cleanVsMessyCaption(allD.map((r) => ({
    name: r.name, messy_f1: r.messy_f1, sgd_f1: r.sgd_f1 }))) : "");
  const dumbbellRows = (rows) => rows.filter(Boolean).map((r) => ({ name: r.name, sgd: r.sgd_f1, messy: r.messy_f1 }));
  drawDumbbell(one, [
    { heading: "Classic (trained on set D)", rows: dumbbellRows(classicD) },
    { heading: "Transformers", rows: dumbbellRows(transformers) }
  ]);
  drawTable(one, ["Model", "SGD test", "MASSIVE test", "Messy test"], allD.map((r) =>
    [r.name, f2(r.sgd_f1), f2(r.massive_f1), f2(r.messy_f1)]));

  const classic = ["Naive Bayes", "Logistic Regression", "Linear SVM"];
  const messyOf = (set, name) => {
    const row = classicRows.find((r) => r.training_set === set && r.name === name);
    return row ? row.messy_f1 : null;
  };
  const risesForAll = classic.every((name) => messyOf(SET_D, name) > messyOf(SETS_AD[0], name));
  const two = chartSection("Messy F1 by training data", risesForAll
    ? "Mixing MASSIVE and typo copies into SGD (set A to set D) raises messy F1 for all three classic models."
    : "Messy F1 of the three classic models for each training set.");
  drawBars(two, SETS_AD, classic.map((name, i) => ({
    name: name, color: SERIES_COLORS[i],
    values: SETS_AD.map((set) => {
      const row = classicRows.find((r) => r.training_set === set && r.name === name);
      return row ? row.messy_f1 : null;
    })
  })));

  const slotRows = allD.map((r) => ({ name: r.name, value: r.messy_slots ? r.messy_slots.event_name : null }));
  const three = chartSection("Event-name F1 on messy requests",
    slotRows.some((r) => r.value != null) ? eventNameCaption(slotRows) : "");
  drawBars(three, slotRows.map((r) => r.name), [
    { name: "Event-name F1", color: MUTED,
      colors: slotRows.map((r) => (r.name === "BERTweet" ? SERIES_COLORS[0] : MUTED)),
      values: slotRows.map((r) => r.value) }
  ]);

  const points = (data.learning_curve || []).map((p) => ({
    fraction: p.fraction, value: p.test_f1, sentences: p.sentences,
    label: Math.round(p.fraction * 100) + "% of training data (" + fmt(p.sentences) + " sentences)"
  }));
  const first = points[0], last = points[points.length - 1];
  const lead = points.length && Math.round(last.fraction / first.fraction) === 10 ? "Ten times more data" : "More data";
  const four = chartSection("Learning curve (Linear SVM, SGD only)", points.length
    ? lead + " barely helps: " + Math.round(first.fraction * 100) + "% of the data already reaches " +
      f2(first.value) + ", all of it " + f2(last.value) + "."
    : "");
  if (points.length) drawLine(four, points);
  else four.host.append(el("p", "muted", "No data yet."));
}

function addExamples() {
  for (const example of EXAMPLES) {
    const button = el("button", null, example);
    button.type = "button";
    button.addEventListener("click", () => {
      $("text").value = example;
      $("text").focus();
    });
    $("examples").append(button);
  }
}

$("compare").addEventListener("click", compare);
$("tab-try").addEventListener("click", () => showTab("try"));
$("tab-results").addEventListener("click", () => showTab("results"));
addExamples();
loadStatus();
</script>
